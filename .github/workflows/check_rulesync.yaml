name: Check rulesync

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check-rulesync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Validate rulesync SSOT (AGENTS.md and .agents/skills/)
        run: |
          npm run rules:generate
          status="$(git status --porcelain --untracked-files=all -- AGENTS.md .agents/)"
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- AGENTS.md .agents/
            echo "::error::rulesync outputs out of sync. Edit .rulesync/, run npm run rules:generate, commit AGENTS.md and .agents/skills/."
            exit 1
          fi
