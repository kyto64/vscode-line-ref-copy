# The file name is registered in the Marketplace Trusted Publishing policy; do not rename it.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.1.3)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # Passed via env (never interpolated into scripts) to avoid script injection.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always publish from the tag, never from a branch HEAD. Fails if the tag does not exist.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js 24 (Active LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: xvfb-run -a npm test

      - name: Compile
        run: npm run compile

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v${pkg_version}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Verify version is not already on the Marketplace
        # vsce publish also fails on an existing version; this check fails earlier and re-publishing an old tag is blocked.
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          publisher=$(node -p "require('./package.json').publisher")
          name=$(node -p "require('./package.json').name")
          published=$(npx @vscode/vsce show "${publisher}.${name}" --json | node -e '
            let s = ""
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              console.log(JSON.parse(s).versions.map((v) => v.version).join("\n"))
            })')
          if printf '%s\n' "${published}" | grep -qxF "${pkg_version}"; then
            echo "::error::Version ${pkg_version} is already published on the Marketplace"
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace (Trusted Publishing)
        run: npx @vscode/vsce publish --oidc
